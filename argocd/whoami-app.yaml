apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami                 # the name shown on the Argo CD card
  namespace: argocd            # Applications always live here
spec:
  project: default
  source:
    repoURL: https://github.com/preethi9418/argocd-learning.git
    targetRevision: main       # branch
    path: apps/whoami          # ← the folder you just made
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
